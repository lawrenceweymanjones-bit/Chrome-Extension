<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snap Gallery</title>
  <link rel="icon" href="icons/icon32.png" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --card: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #18181b;
      --accent-fg: #ffffff;
      --danger: #dc2626;
      --overlay: rgba(0, 0, 0, 0.82);
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --card: #18181b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --accent: #fafafa;
        --accent-fg: #18181b;
        --overlay: rgba(0, 0, 0, 0.9);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 img { width: 22px; height: 22px; border-radius: 5px; }
    header .meta { color: var(--muted); font-size: 13px; }
    header .spacer { flex: 1; }
    .btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--muted); }
    .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { border-color: var(--danger); }

    main { padding: 24px; max-width: 1400px; margin: 0 auto; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    .card .thumb {
      aspect-ratio: 16 / 10;
      background: var(--border);
      overflow: hidden;
    }
    .card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      image-rendering: auto;
      -webkit-backface-visibility: hidden;
    }
    .card .body { padding: 12px 14px 14px; }
    .card .title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .url {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .date { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .card .note {
      margin-top: 8px;
      font-size: 13px;
      color: var(--fg);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0.85;
    }

    .empty {
      text-align: center;
      padding: 120px 24px;
      color: var(--muted);
    }
    .empty h2 { color: var(--fg); font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    .empty kbd {
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--card);
    }

    /* Viewer */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--overlay);
      display: none;
      grid-template-columns: 1fr 340px;
    }
    .viewer.open { display: grid; }
    .viewer .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: auto;
      position: relative;
    }
    .viewer .stage img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      background: #fff;
    }
    .viewer .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }
    .viewer .nav:hover { background: rgba(255, 255, 255, 0.24); }
    .viewer .nav.prev { left: 16px; }
    .viewer .nav.next { right: 16px; }
    .viewer .panel {
      background: var(--card);
      color: var(--fg);
      border-left: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
    }
    .viewer .panel .close {
      align-self: flex-end;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }
    .viewer .panel h2 { font-size: 15px; margin: 0; word-break: break-word; }
    .viewer .panel a {
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
      text-decoration: none;
    }
    .viewer .panel a:hover { text-decoration: underline; }
    .viewer .panel .info { color: var(--muted); font-size: 12px; }
    .viewer .panel label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .viewer .panel textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    .viewer .panel .saved { font-size: 12px; color: var(--muted); min-height: 16px; }
    .viewer .panel .actions { display: flex; gap: 8px; margin-top: auto; }
    .viewer .panel .actions .btn { flex: 1; }

    @media (max-width: 760px) {
      .viewer { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .viewer .panel { border-left: none; border-top: 1px solid var(--border); max-height: 45vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1><img src="icons/icon48.png" alt="" /> Snap Gallery</h1>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <button class="btn danger" id="clear" hidden>Delete all</button>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <h2>No screenshots yet</h2>
      <p>Click the Snap Gallery icon in your toolbar, or press <kbd>⌥ ⇧ S</kbd>, on any page to capture it.</p>
    </div>
  </main>

  <div class="viewer" id="viewer">
    <div class="stage">
      <button class="nav prev" id="prev" title="Previous (←)">‹</button>
      <img id="full" alt="" />
      <button class="nav next" id="next" title="Next (→)">›</button>
    </div>
    <aside class="panel">
      <button class="close" id="close" title="Close (Esc)">×</button>
      <h2 id="vTitle"></h2>
      <a id="vUrl" target="_blank" rel="noopener"></a>
      <div class="info" id="vInfo"></div>
      <label for="note">Note</label>
      <textarea id="note" placeholder="Why did you save this?"></textarea>
      <div class="saved" id="saved"></div>
      <div class="actions">
        <button class="btn" id="download">Download</button>
        <button class="btn danger" id="delete">Delete</button>
      </div>
    </aside>
  </div>

  <script src="db.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
