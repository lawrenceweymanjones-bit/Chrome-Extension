<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Snap Gallery</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #18181b;
      --accent-fg: #ffffff;
      --ok: #16a34a;
      --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --accent: #fafafa;
        --accent-fg: #18181b;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button kbd {
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: 0.6;
    }
    #status {
      min-height: 18px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
  </style>
</head>
<body>
  <h1>Snap Gallery</h1>
  <button id="capture" class="primary">Capture this tab <kbd>⌥⇧S</kbd></button>
  <button id="gallery">Open gallery <kbd id="count"></kbd></button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
